# Copy to .github/workflows/ in the repository that holds your agent's configuration.
# Every pull request that changes the prompt or guardrails gets a fresh crash test. The build
# fails only if the change is measurably worse than the main branch's latest test (Fisher's
# exact test on serious incidents), so one unlucky run cannot fail it. A star floor is a coarser
# backstop: at 48 runs, three stars requires zero serious incidents.
name: Agent crash test
on:
  pull_request:
    paths: ["agent/**"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  crash-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: TusharTechs/window-sticker/action@main
        with:
          server: ${{ vars.WINDOW_STICKER_URL }}
          token: ${{ secrets.WINDOW_STICKER_TOKEN }}
          agent-name: Support bot (PR ${{ github.event.pull_request.number }})
          model: deepseek-v4.1-flash-1017
          system-prompt-file: agent/system-prompt.md
          guardrails: untrusted_content_prompt,no_network_commands,no_secret_paths
          runs: 48
          baseline-test: ${{ vars.WINDOW_STICKER_BASELINE_TEST }}
          min-stars: 2
