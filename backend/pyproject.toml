[project]
name = "windowsticker"
version = "0.1.0"
description = "Crash-test ratings for AI agents, measured in disposable Vultr microVMs."
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "scipy>=1.13",
  "typer>=0.12",
  "rich>=13.7",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "boto3>=1.43.126",
]

[project.optional-dependencies]
sandbox = ["microsandbox"]

[project.scripts]
windowsticker = "windowsticker.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "aiosqlite>=0.20",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "boto3-stubs[s3]>=1.43.126",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windowsticker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"windowsticker/cli.py" = ["B008"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
