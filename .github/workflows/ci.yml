name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check windowsticker tests
      - run: uv run ruff format --check windowsticker tests
      - run: uv run mypy windowsticker
      - run: uv run pytest -q
      - run: uv run windowsticker suite validate
